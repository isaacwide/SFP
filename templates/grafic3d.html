<!DOCTYPE html>
<html lang="es">
<head>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ titulo }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/c2.css') }}">
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>{{ titulo }}</h1>
        </div>

        <div class="content-wrapper">
            <div class="left-panel">
                <div class="info-card">
                    <h3>⚙️ Parámetros de Simulación</h3>
                    <!-- FORMULARIO CORREGIDO -->
                    <form id="formulario" class="param-form" onsubmit="return false;">
                        {% if distribucion == 'gebbs' %}
                        <div class="input-group">
                            <label for="x">Valor inicial x0:</label>
                            <input type="number" id="x" name="x" min="0" max="10" value="1" required>
                            <small>Valor inicial para x</small>

                            <label for="y">Valor inicial y0:</label>
                            <input type="number" id="y" name="y" min="0" max="10" value="1" required>
                            <small>Valor inicial para y</small>

                            <label for="n">Número de iteraciones:</label>
                            <input type="number" id="n" name="n" min="100" max="100000" value="1000" required>
                            <small>Cantidad de muestras a generar</small>
                        </div>

                        <script src="{{ url_for('static', filename='js/3dgrafic.js') }}"></script>
                        {% endif %}

                        <button type="submit" class="update-button">🔄 Actualizar Simulación</button>
                    </form>
                </div>

                <div style="text-align: center;">
                    <a href="/" class="back-button">← Volver al inicio</a>
                </div>
            </div>

            <div class="right-panel">
                <div class="grafico-container">
                    <div id="grafica3d" style="width:600px; height:600px;"></div>
                    <div id="histo3d" style="width:600px; height:600px;"></div>
                </div>
            </div>
        </div>
    </div>

    
</body>
</html>
